version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: devops_agent_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-devops_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-devops_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agent_network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_agent_backend
    ports:
      - "8080:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-pass}@db:5432/${POSTGRES_DB:-devops_agent}
      - DEBUG=${DEBUG:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:3001}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:8080}
      - API_KEY=${API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent_network

  log-simulator:
    build:
      context: ./log-simulator
      dockerfile: Dockerfile
    container_name: devops_agent_simulator
    environment:
      - BACKEND_URL=http://backend:8000
      - ANOMALY_RATE=${ANOMALY_RATE:-0.2}
      - INTERVAL_SECONDS=${INTERVAL_SECONDS:-10}
      - SIMULATOR_APP_ID=${SIMULATOR_APP_ID:-}
      - API_KEY=${API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops_agent_frontend
    ports:
      - "3001:80"
    # The frontend is a static nginx build; it reads the API base URL at
    # runtime from public/config.js (window.APP_CONFIG), not from a build-time
    # env var. To point it elsewhere, edit frontend/public/config.js.
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - agent_network

volumes:
  postgres_data:

networks:
  agent_network:
    driver: bridge
